<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Materialize CSS Learning</title>
    <link rel="stylesheet" href="css/materialize.css">
</head>
<body>
    <div class="container">
        <h1>Cards</h1>
        <div class="row">
            <div class="col s12 m6 l4">
                <div class="card">
                    <div class="card-image">
                        <img src="img/car-1.jpg" alt="BMW" class="responsive-img">
                    </div>
                    <div class="card-content">
                        <h4 class="card-title blue-text text-darken-4">
                            BMW Motorsport
                        </h4>
                        <p>
                            Fast, Elegant sports car
                        </p>
                    </div>
                    <div class="card-action">
                        <a class="blue-text text-darken-4" href="#">Details</a>
                        <a class="blue-text text-darken-4" href="#">Add To Cart</a>
                    </div>
                </div>
            </div>

            <div class="col s12 m6 l4">
                <div class="card">
                    <div class="card-image">
                        <img src="img/car-2.jpg" alt="Mercedes" class="responsive-img">
                    </div>
                    <div class="card-content">
                        <h4 class="card-title blue-text text-darken-4">
                            Mercedes Benz
                        </h4>
                        <p>
                            Sleek, 4WD compatible SUV
                        </p>
                    </div>
                    <div class="card-action">
                        <a class="blue-text text-darken-4" href="#">Details</a>
                        <a class="blue-text text-darken-4"  href="#">Add To Cart</a>
                    </div>
                </div>
            </div>

            <div class="col s12 m6 l4">
                <div class="card">
                    <div class="card-image">
                        <img src="img/car-3.jpg" alt="Audi" class="responsive-img">
                    </div>
                    <div class="card-content">
                        <h4 class="card-title blue-text text-darken-4">
                            Audi
                        </h4>
                        <p>
                            Portable, Efficient Sedan
                        </p>
                    </div>
                    <div class="card-action">
                        <a class="blue-text text-darken-4" href="#">Details</a>
                        <a class="blue-text text-darken-4"  href="#">Add To Cart</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
