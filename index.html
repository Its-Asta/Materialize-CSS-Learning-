<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/materialize.css">
    <title>Materialize CSS</title>
</head>
<body>
    <header class="container">
        <h1 class="blue-text text-lighten-3"> Materialize CSS </h1>
        <h2 class="blue-text text-lighten-2 center-align">Materialize CSS</h2>
        <h3 class="red-text text-lighten-1 left-align">Materialize CSS</h3>
        <h4 class="orange-text text-lighten-4 right-align">Materialize CSS</h4>
        <h5 class="green-text text-accent-3">Materialize CSS</h5>
        <h6 class="yellow-text text-darken-1">Materialize CSS</h6>
        
    </header>

    <main>
        <div class="container">
            <div class="blue darken-4 green-text text-accent-4">
                <p>
                    Div 1
                </p>
            </div>
            <div class="indigo red-text text-accent-4">
                <p>
                    Div 2
                </p>
            </div>

            <!-- Buttons -->
            <h1>Buttons</h1>
            <h6>Colours</h6>
            <button class="btn red black-text">
                Submit
            </button>

            <a href="" class="btn">
            Anchor Button
            </a>
            <button class="btn orange blue-text text-darken-4"> Accept</button>
            <button class="btn pink indigo-text"> Enter</button>
            <h6>Button sizes</h6>
            <button class="btn btn-small">Button</button>
            <button class="btn">Button</button>
            <button class="btn btn-large">Button</button>
            <h6>Flat Button</h6>
            <button class="btn btn-flat blue white-text">Button</button>
            <h6>Floating Button</h6>
            <button class="btn btn-floating"> Hi</button>
        </div>
    </main>

    <footer>

    </footer>
</body>
</html>
